<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio - Pizzaria</title>
  <link rel="stylesheet" href="../compartilhado/css/base.css">
  <link rel="stylesheet" href="css/cliente.css">
</head>
<body>
  
  <header>
    <!-- Dica: renomeie seu arquivo de imagem para 'logo.png' para evitar erros -->
    <img src="img/WhatsApp Image 2026-10-31 at 19.22.16-Photoroom.png" alt="Logo da Pizzaria" class="logo-img">
    <h1>🍕 <span id="nomePizzaria">Pizzaria</span></h1>
  </header>

  <div id="banner" class="banner"></div>
        
  <main class="container">
  
    <section id="cardapio"></section> 
  
    <aside class="carrinho">
      <div id="areaPedido" class="coluna">
        <h2>🛒 Seu pedido</h2>
        <div id="itensCarrinho"></div>

        <div id="totais">
          <p>Subtotal: <span id="subtotal"></span></p>
          <p>Entrega: <span id="entrega"></span></p>
          <p><strong>Total: <span id="total"></span></strong></p>
        </div>

        <h3>Tipo de Pedido</h3>
        <select id="tipoEntrega" onchange="atualizarTipoEntrega()">
          <option value="entrega">📦 Delivery</option>
          <option value="retirada">🏃‍♂️ Retirar no Estabelecimento</option>
        </select>

        <h3>Seus dados</h3>
        <input type="text" id="nomeCliente" placeholder="Seu nome">
        <input type="text" id="telefoneCliente" placeholder="Telefone">
        <input type="text" id="enderecoCliente" placeholder="Endereço de entrega">
        <select id="pagamento">
          <option>Pix (pagar agora pelo QR Code)</option>
          <option>Cartão (na entrega)</option>
          <option>Dinheiro (na entrega)</option>
        </select>
        <input type="text" id="obsCliente" placeholder="Observações (ex: troco para 50)">
        <button class="btn" onclick="finalizarPedido()">Confirmar pedido</button>
      </div>

      <div id="areaConfirmacao" class="coluna" style="display:none"></div>
    </aside>
  </main>

  <a href="#areaPedido" id="barraCarrinho" class="barra-carrinho">
    <span>🛒 Ver pedido (<span id="barraQtd"></span>)</span>
    <span id="barraTotal"></span>
  </a>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="../compartilhado/js/dados.js"></script>
  <script src="js/pix.js"></script>
  <script src="js/cliente.js"></script>
</body>
</html>
